[package]
name = "mlc-cli"
version = "0.1.0"
edition = "2021"
description = "An unofficial CLI for The MLC Public Search API"
repository = "https://github.com/oneortwo/mlc-cli"
license = "MIT"

[[bin]]
name = "mlc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
toml = "0.8"
comfy-table = "7"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
