[package]
name = "mlc-cli"
version = "0.2.0"
edition = "2021"
description = "An unofficial CLI for The MLC Public Search API"
repository = "https://github.com/oneortwo/mlc-cli"
license = "MIT"
readme = "README.md"
keywords = ["mlc", "music", "publishing", "royalties", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "mlc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
toml = "0.8"
comfy-table = "7"
dialoguer = { version = "0.11", default-features = false, features = ["password"] }
tempfile = "3"
sha2 = "0.10"
semver = "1"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
assert_cmd = "2"
